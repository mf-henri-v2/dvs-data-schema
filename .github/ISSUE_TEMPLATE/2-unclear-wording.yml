name: "Unclear wording"
description: "You are not sure what something means, or it could be read in more than one way."
labels: ["draft clarity", "triage"]
body:
  - type: markdown
    attributes:
      value: "Tell us which words are unclear and why. You do not need to suggest new wording."
  - type: input
    id: page
    attributes:
      label: "Page (optional)"
      description: "The page your feedback is about. This is filled in for you if you followed a feedback link on the reading website."
  - type: dropdown
    id: guide
    attributes:
      label: "Which guide is this about?"
      options:
        - "GPG 45: identity checking"
        - "GPG 44: authentication"
        - "Both guides"
        - "Supporting material"
        - "Something else, or not sure"
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: "Which section is this about?"
      description: "Each guide has the same 6 sections. Choose the last option if you are not sure."
      options:
        - "1. Introduction"
        - "2. Data taxonomy"
        - "3. Data model"
        - "4. Data dictionary"
        - "5. Predefined values"
        - "6. Predefined lists"
        - "Not about a specific section, or not sure"
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: "Field or value name (optional)"
      description: "If you know it. You can describe it in your own words instead."
      placeholder: "For example, date_of_expiry or check_method"
  - type: textarea
    id: unclear
    attributes:
      label: "What is unclear?"
      description: "Quote the words if you can, and explain what is unclear about them."
    validations:
      required: true
  - type: textarea
    id: reading
    attributes:
      label: "How did you read it? (optional)"
      description: "If you can see more than one meaning, describe them."
    validations:
      required: false
  - type: textarea
    id: suggestion
    attributes:
      label: "Suggested wording (optional)"
      description: "If you have one. It is fine to leave this blank."
    validations:
      required: false
  - type: markdown
    attributes:
      value: "Issues are public. Do not include personal data, such as names, email addresses or details about individuals."
