name: "Schema feedback"
description: "Something in the data schema does not work in practice, is missing, or conflicts with something else."
labels: ["proposed change", "triage"]
body:
  - type: markdown
    attributes:
      value: "Use this form for feedback about what the data schema says: its data elements, what they are called and what they mean, their types, the values they can have, and how they fit together. You do not need to suggest new wording, and you do not need to know the technical name of a field.\n\nOfDIA considers this feedback through its policy process. Raising an issue does not by itself change the data schema."
  - type: input
    id: page
    attributes:
      label: "Page (optional)"
      description: "The page your feedback is about. This is filled in for you if you followed a feedback link on the reading website."
  - type: dropdown
    id: guide
    attributes:
      label: "Which guide is this about?"
      options:
        - "GPG 45: identity checking"
        - "GPG 44: authentication"
        - "Both guides"
        - "Supporting material"
        - "Something else, or not sure"
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: "Which section is this about?"
      description: "Each guide has the same 6 sections. Choose the last option if you are not sure."
      options:
        - "1. Introduction"
        - "2. Data taxonomy"
        - "3. Data model"
        - "4. Data dictionary"
        - "5. Predefined values"
        - "6. Predefined lists"
        - "Not about a specific section, or not sure"
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: "Field or value name (optional)"
      description: "If you know it. You can describe it in your own words instead."
      placeholder: "For example, date_of_expiry or check_method"
  - type: textarea
    id: feedback
    attributes:
      label: "What is your feedback?"
      description: "Explain what does not work in practice, is missing, or conflicts with something else."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: "Who is affected, and how? (optional)"
      description: "For example, service providers, relying parties, or people using a service."
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence or examples (optional)"
      description: "For example, experience of using the data schema, a worked example, or another standard that does this differently."
    validations:
      required: false
  - type: textarea
    id: suggestion
    attributes:
      label: "Suggested change (optional)"
      description: "If you have one. It is fine to leave this blank."
    validations:
      required: false
  - type: markdown
    attributes:
      value: "Issues are public. Do not include personal data, such as names, email addresses or details about individuals."
